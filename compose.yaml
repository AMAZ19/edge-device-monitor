name: edge-device-monitor

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - iot-network

  simulator:
    build:
      context: ./device-simulator
      dockerfile: Dockerfile
    image: edge-device-simulator:1.3-alpine
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MEASUREMENT_INTERVAL: "5"
      DEVICE_ID: edge-device-compose-001
    networks:
      - iot-network

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .compose.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - iot-network

  consumer:
    build:
      context: ./device-simulator
      dockerfile: Dockerfile
    image: edge-device-simulator:1.3-alpine
    command: ["python", "mqtt_consumer.py"]
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .compose.env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - sqlite_data:/data
    networks:
      - iot-network


  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - consumer
    networks:
      - iot-network



  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - iot-network



  mqtt-webhook:
    build:
      context: ./device-simulator
      dockerfile: Dockerfile.webhook
    restart: unless-stopped
    env_file:
      - ./device-simulator/.webhook.env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      - mosquitto
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

secrets:
  grafana_admin_password:
    file: ./docker/grafana/admin_password.txt

volumes:
  postgres_data:
  sqlite_data:
  prometheus_data:
  grafana_data:
