global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "mqtt-consumer"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "consumer:8000"

  - job_name: "mqtt-security-monitor"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "security-monitor:8001"
