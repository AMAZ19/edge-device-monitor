name: IoT Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: device-simulator/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r device-simulator/requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest device-simulator/ -q

  config-validation:
    name: Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Grafana dashboard
        run: |
          python3 -m json.tool \
            docker/grafana/dashboards/iot-monitoring.json \
            > /dev/null

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_dummy_password
          POSTGRES_DB: iot_telemetry
        run: |
          mkdir -p docker/grafana
          printf 'ci_dummy_password\n' \
            > docker/grafana/admin_password.txt

          printf '%s\n' \
            'POSTGRES_USER=ci_user' \
            'POSTGRES_PASSWORD=ci_dummy_password' \
            'POSTGRES_DB=iot_telemetry' \
            > .compose.env

          printf '%s\n' \
            'MQTT_HOST=mosquitto' \
            'MQTT_PORT=1883' \
            > device-simulator/.webhook.env

          docker compose config --quiet

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build simulator image
        run: |
          docker build \
            -f device-simulator/Dockerfile \
            -t edge-device-simulator:ci \
            device-simulator/

      - name: Build webhook image
        run: |
          docker build \
            -f device-simulator/Dockerfile.webhook \
            -t edge-device-webhook:ci \
            device-simulator/
