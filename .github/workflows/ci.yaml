name: IoT Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: device-simulator/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r device-simulator/requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest device-simulator/ -q

  config-validation:
    name: Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Grafana dashboard
        run: |
          python3 -m json.tool \
            docker/grafana/dashboards/iot-monitoring.json \
            > /dev/null

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_dummy_password
          POSTGRES_DB: iot_telemetry
        run: |
          mkdir -p docker/grafana
          printf 'ci_dummy_password\n' \
            > docker/grafana/admin_password.txt

          printf '%s\n' \
            'POSTGRES_USER=ci_user' \
            'POSTGRES_PASSWORD=ci_dummy_password' \
            'POSTGRES_DB=iot_telemetry' \
            > .compose.env

          printf '%s\n' \
            'MQTT_HOST=mosquitto' \
            'MQTT_PORT=1883' \
            > device-simulator/.webhook.env

          docker compose config --quiet

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build simulator image
        run: |
          docker build \
            -f device-simulator/Dockerfile \
            -t edge-device-simulator:ci \
            device-simulator/

      - name: Build webhook image
        run: |
          docker build \
            -f device-simulator/Dockerfile.webhook \
            -t edge-device-webhook:ci \
            device-simulator/

  mqtt-security-integration:
    name: MQTT TLS and Authentication Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate temporary MQTT test materials
        run: |
          bash scripts/ci/setup_mqtt_test_broker.sh

      - name: Create isolated Docker network
        run: |
          docker network create iot-mqtt-ci-network

      - name: Start isolated MQTT TLS broker
        run: |
          docker run -d \
            --name iot-mqtt-ci-broker \
            --network iot-mqtt-ci-network \
            --network-alias mosquitto \
            --restart no \
            --mount type=bind,src=/tmp/iot-mqtt-ci/mosquitto.conf,dst=/mosquitto/config/mosquitto.conf,readonly \
            --mount type=bind,src=/tmp/iot-mqtt-ci/certs,dst=/mosquitto/certs,readonly \
            --mount type=bind,src=/tmp/iot-mqtt-ci/auth,dst=/mosquitto/auth,readonly \
            eclipse-mosquitto:2

      - name: Wait for MQTT broker
        run: |
          for attempt in $(seq 1 30); do
            if docker logs iot-mqtt-ci-broker 2>&1 | \
              grep -q 'Opening ipv4 listen socket on port 8883'; then
              test "$(docker inspect \
                --format '{{.State.Running}}' \
                iot-mqtt-ci-broker)" = "true"
              echo "PASS: MQTT TLS broker ready"
              exit 0
            fi
            sleep 1
          done

          docker logs iot-mqtt-ci-broker
          exit 1

      - name: Run MQTT security integration tests
        run: |
          docker run --rm \
            --network iot-mqtt-ci-network \
            --mount type=bind,src="$PWD/device-simulator",dst=/tests,readonly \
            --mount type=bind,src=/tmp/iot-mqtt-ci/certs/ca.crt,dst=/certs/ca.crt,readonly \
            --mount type=bind,src=/tmp/iot-mqtt-ci/secrets/iot_simulator.txt,dst=/secrets/iot_simulator.txt,readonly \
            -e MQTT_INTEGRATION_TESTS=1 \
            -e MQTT_TEST_HOST=mosquitto \
            -e MQTT_TEST_PORT=8883 \
            -e MQTT_TEST_CA_CERT=/certs/ca.crt \
            -e MQTT_TEST_USERNAME=iot_simulator \
            -e MQTT_TEST_PASSWORD_FILE=/secrets/iot_simulator.txt \
            python:3.12-slim \
            sh -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq openssl >/dev/null
              pip install --quiet --root-user-action=ignore \
                pytest paho-mqtt==2.1.0

              python -m pytest \
                -p no:cacheprovider \
                /tests/test_mqtt_auth_integration.py \
                /tests/test_mqtt_tls_integration.py \
                -v
            '

      - name: Check broker logs
        if: always()
        run: |
          if docker container inspect iot-mqtt-ci-broker \
            >/dev/null 2>&1; then
            docker logs --tail 50 iot-mqtt-ci-broker
          fi

      - name: Clean up isolated MQTT environment
        if: always()
        run: |
          docker rm -f iot-mqtt-ci-broker 2>/dev/null || true
          docker network rm iot-mqtt-ci-network 2>/dev/null || true
